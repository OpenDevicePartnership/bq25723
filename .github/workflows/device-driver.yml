# This workflow verifies that `src/device.rs` stays in sync with code generated by `device-driver-cli`.
# It regenerates the device driver from `bq25723.ddsl` and checks that the generated output matches
# the committed `src/device.rs`. See check.yml for information about concurrency cancellation and
# workflow triggering behavior, which this workflow shares.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: device-driver-pregen-check
jobs:
  device-driver-pregen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: device-driver-pregen-check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Check generated device driver
        uses: tullom/device-driver-pregen-check@v1.2.0
        with:
          source: bq25723.ddsl
          generated-file: src/device.rs
          cli-version: '2.1.0'
          rust-toolchain: '1.94.0'
          rust-defmt-feature: defmt-03
